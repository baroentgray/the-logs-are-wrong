    containment: unlimited
  initial_admission_delay_seconds: 0
  normal_feed_delay_seconds: 5
  early_feed_delay_seconds: 2
  saw_cycle_seconds: 6
  repair_hold_seconds: 6
  movement_noise_seconds: 2
  default_timeout_route: saw_queue
  same_tick_order:
  - hold_and_procedure_completions
  - accepted_intents_by_server_receive_sequence
  - deadline_expirations
  - saw_transitions
  - feed_and_auto_routes
  - derived_states
  - event_emission
line_noise:
  quiet_when_all_inactive:
  - saw
  - movement_noise
  - repair
  penitent_confirm_requires_continuous_quiet_seconds: 4
  reset_test_progress_when_loud: true
  pause_intake_timer_during_test: false
resources:
  consumable:
    holy_water: 2
    salt: 2
    red_tape: 2
  reusable:
  - sound_meter
  - choir_cassette
  - scale
  - caliper
  - relabel_stamp
  - hamster_statue
containment:
  unlimited_capacity: true
  ritual_hold_seconds: 4
  service_requested_grace_seconds: 20
  overdue_seconds: 10
  interval_by_danger_weight:
    '1': 90
    '2': 75
    3_or_more: 60
  after_successful_ritual:
    return_state: STABLE
    retain_logs: true
    retain_danger_weight: true
    restart_interval_from_current_weight: true
  prototype_incident:
    type: forced_line_pause
    duration_seconds: 8
    remains_incident_until_ritual: true
    repeat_before_resolution: false
  post_facto_interval_inference:
    allowed: true
    rationale: legal deduction after irreversible writeoff; exact countdown is not
      shown
    seeded_jitter: false
success_predicate:
  all:
  - quota_by_species_met
  - correctly_processed_anomalies_at_least_2
